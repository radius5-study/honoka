[project]
name = "honoka-llms"
version = "0.1.0"
description = "Serve llms.txt for a honoka app, generated from its routes"
authors = [
    { name = "L4Ph", email = "me@l4ph.moe" }
]
requires-python = ">=3.13"
dependencies = [
    "honoka",
    "honoka-openapi",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
honoka = { workspace = true }
honoka-openapi = { workspace = true }
honoka-msgspec = { workspace = true }

[dependency-groups]
dev = [
    "honoka-msgspec",
]
