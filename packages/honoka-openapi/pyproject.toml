[project]
name = "honoka-openapi"
version = "0.1.0"
description = "OpenAPI document and Scalar docs for honoka"
authors = [
    { name = "L4Ph", email = "me@l4ph.moe" }
]
requires-python = ">=3.13"
dependencies = [
    "honoka",
    "msgspec>=0.22.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
honoka = { workspace = true }
honoka-msgspec = { workspace = true }

[dependency-groups]
dev = [
    "honoka-msgspec",
]
