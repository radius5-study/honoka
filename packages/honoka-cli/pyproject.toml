[project]
name = "honoka-cli"
version = "0.1.0"
description = "The honoka command: list routes and check an app for mistakes"
authors = [
    { name = "L4Ph", email = "me@l4ph.moe" }
]
requires-python = ">=3.13"
dependencies = [
    "honoka",
]

[project.scripts]
honoka = "honoka_cli:run"

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
honoka = { workspace = true }
