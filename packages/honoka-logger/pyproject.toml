[project]
name = "honoka-logger"
version = "0.1.0"
description = "An access log middleware for honoka"
authors = [
    { name = "L4Ph", email = "me@l4ph.moe" }
]
requires-python = ">=3.13"
dependencies = [
    "honoka",
    "honoka-request-id",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
honoka = { workspace = true }
honoka-request-id = { workspace = true }
