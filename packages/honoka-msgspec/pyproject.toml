[project]
name = "honoka-msgspec"
version = "0.1.0"
description = "msgspec request validation middleware for honoka"
authors = [
    { name = "L4Ph", email = "me@l4ph.moe" }
]
requires-python = ">=3.13"
dependencies = [
    "honoka",
    "msgspec>=0.22.0",
]

[build-system]
requires = ["uv_build>=0.8.17,<0.9.0"]
build-backend = "uv_build"

[tool.uv.sources]
honoka = { workspace = true }
