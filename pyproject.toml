[tool.uv.workspace]
members = [
    "packages/*",
    "benchmarks",
]

[tool.ruff]
line-length = 100
target-version = "py313"

[dependency-groups]
dev = [
    "granian>=2.8.4",
    "httpx>=0.28.1",
    "pyrefly>=1.4.0",
    "pytest>=9.1.1",
    "ruff>=0.17.1",
    "ty>=0.0.89",
]

[tool.ty.src]
exclude = ["packages/*/tests/typing/bad.py"]

[tool.pyrefly]
project-excludes = ["**/.venv/**", "packages/*/tests/typing/bad.py"]
search-path = ["packages/honoka-cli/tests"]

[tool.pytest.ini_options]
testpaths = ["packages", "benchmarks"]
addopts = "-ra"

[tool.ruff.lint]
extend-select = ["ANN"]

[tool.ruff.lint.isort]
known-first-party = ["honoka", "honoka_msgspec", "honoka_middleware", "honoka_openapi"]

# BlackSheep and Robyn ship untyped route decorators, so the strictest "decorator returns Any" rule
# fires on every route of their benchmark apps. Relax that one rule for those two files only.
[[tool.ty.overrides]]
include = [
    "benchmarks/src/honoka_benchmarks/apps/blacksheep_app.py",
    "benchmarks/src/honoka_benchmarks/apps/robyn_app.py",
]

[tool.ty.overrides.rules]
dynamic-function-decorator-return = "ignore"

# A test fixture that must lack a return annotation: it is what `honoka check` has to detect.
[tool.ruff.lint.per-file-ignores]
"packages/honoka-cli/tests/cli_apps/bad.py" = ["ANN201"]
